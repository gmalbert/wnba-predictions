name: WNBA Compile and Browser Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Compile all Python
        run: python -m compileall -q -f -x data_files .

      - name: Validate adapter contracts
        run: |
          python scripts/validate_contract_fixtures.py
          python scripts/verify_frontier_implementation.py

      - name: Start Streamlit
        run: |
          python -m streamlit run predictions.py \
            --server.headless=true \
            --server.port=8513 \
            --browser.gatherUsageStats=false \
            > streamlit-ci.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:8513/_stcore/health && exit 0
            sleep 1
          done
          cat streamlit-ci.log
          exit 1

      - name: Verify Streamlit with Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8513
        run: python scripts/test_playwright.py
