name: WNBA Daily Refresh

on:
  schedule:
    # 4 AM ET daily (WNBA season runs May-September)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch historical + daily data
        run: |
          python scripts/fetch_historical.py --seasons 2023,2024,2025
          python scripts/fetch_odds.py || true
          python scripts/fetch_injuries.py || true

      - name: Train models
        run: python scripts/train_models.py --seasons 2018,2019,2020,2021,2022,2023,2024,2025 --holdout-season 2025

      - name: Generate predictions
        run: |
          python scripts/generate_predictions.py --stage morning
          python scripts/generate_predictions.py --stage injury_report
          python scripts/generate_predictions.py --stage pre_tip

      - name: Publish data health
        run: python scripts/publish_data_health.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_files/ || true
          git commit -m "chore: nightly WNBA data refresh" || echo "No changes to commit"
          git push
