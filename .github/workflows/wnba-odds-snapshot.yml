name: WNBA Odds Snapshot

on:
  schedule:
    # Every 4 hours during WNBA season
    - cron: "17 12,16,20,0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  odds:
    runs-on: ubuntu-latest
    env:
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      THERUNDOWN_API_KEY: ${{ secrets.THERUNDOWN_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check WNBA season
        id: season
        shell: bash
        run: |
          month=$(date -u +%m)
          if (( 10#$month >= 5 && 10#$month <= 9 )); then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside the WNBA season; skipping odds fetch."
          fi

      - uses: actions/setup-python@v5
        if: steps.season.outputs.active == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.season.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot odds
        if: steps.season.outputs.active == 'true'
        run: python scripts/fetch_odds.py --force --horizon pre_tip || true

      - name: Create odds snapshot pull request
        if: steps.season.outputs.active == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/odds-snapshot
          delete-branch: true
          commit-message: "chore: WNBA odds snapshot"
          title: "chore: refresh WNBA odds snapshot"
          body: |
            ## Summary
            - Refreshes the tracked odds snapshot from the scheduled workflow.

            ## Validation
            - Generated by the `WNBA Odds Snapshot` GitHub Actions workflow.
